# optimizer-tools auf der NAS: im Verzeichnis dieser Datei (~/optimizer-tools) `docker compose up -d` (siehe README.md), ohne sudo.
# Liest die Protokolle des Node-RED-Optimierers NUR LESEND und schreibt nur in den Unterordner optimizer-tools/ des Node-RED-Datenvolumes,
# den Node-RED als /data/optimizer-tools sieht (ohne Neuerstellen von Node-RED). Braucht kein Netz.
# VORHER einmalig (als node-red, ohne root):  docker exec node_red-node-red-1 sh -c 'mkdir -p /data/optimizer-tools && chmod 2775 /data/optimizer-tools'
# Das Image wird auf dem PC gebaut und per `docker save | ssh docker load` übertragen, nie aus dem Netz geholt.
name: optimizer-tools

services:
  optimizer-tools:
    image: optimizer-tools:1
    pull_policy: never              # nie von Docker Hub holen; fehlt das Image, bricht compose mit „No such image“ ab
    container_name: optimizer-tools
    labels:
      com.centurylinklabs.watchtower.enable: "false"   # Watchtower (läuft auf der NAS für alle Container) fasst diesen nicht an
    restart: unless-stopped
    init: true                      # tini als PID 1: Signale und Zombies sauber
    network_mode: none              # kein Netz nötig (keine Abrufe, kein Sprachmodell)
    read_only: true                 # Wurzeldateisystem schreibgeschützt ...
    tmpfs:
      - /tmp:size=128m,mode=1777    # ... nur /tmp (Arbeitskopien des Trainings, ~10 MB) und /ergebnis sind schreibbar
    user: "10001:10001"             # nicht root und nicht uid 1000 (node-red): owm.json/vrm.json (600, uid 1000) bleiben unlesbar
    group_add: ["1000"]             # Gruppe node-red: schreiben in /data/optimizer-tools (2775, 1000:1000); öffnet KEINE 600-Dateien
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 2
    pids_limit: 64
    environment:
      TZ: Europe/Berlin
      ZEITPLAN: "06:40"             # HH:MM[,HH:MM] Ortszeit; danach Training, Replay (Vortag), Kennzahlen (Vortag), Sicherung
      NACHHOLEN: "1"                # nach Neustart einen verpassten Lauf des Tages nachholen
      AUFBEWAHREN_TAGE: "120"       # Replay-Berichte und Trainingsparameter so lange behalten
      SICHERUNG_TAGE: "120"         # tägliche Archive der Protokolle so lange behalten
      SICHERUNG_MONATSERSTE: "1"    # Archiv vom 1. jedes Monats (Vormonat komplett) unbegrenzt behalten
    volumes:
      - type: bind
        source: ${OT_DATEN:-/volume2/@docker/volumes/node_red_node-red-data/_data/optimizer}
        target: /daten
        read_only: true
        bind:
          create_host_path: false   # fehlt der Ordner, Fehler statt leerem root-Ordner
      - type: bind
        source: ${OT_ERGEBNIS:-/volume2/@docker/volumes/node_red_node-red-data/_data/optimizer-tools}
        target: /ergebnis
        bind:
          create_host_path: false   # muss vorher (s. o.) als node-red angelegt sein, sonst legte Docker ihn als root an (nicht schreibbar)
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
